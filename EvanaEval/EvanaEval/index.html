<!DOCTYPE html>
<html>
<head>
    <title>EvanaEval - Crypto Prices</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .price-box { margin: 20px 0; padding: 20px; border: 1px solid #ccc; }
        canvas { max-width: 100%; height: auto; }
    </style>
</head>
<body>

<h1>EvanaEval - Crypto Prices</h1>

<div class="price-box" id="btc-box">
    <h2>BTC Price</h2>
    <p id="btc-price">Loading...</p>
    <canvas id="btc-chart"></canvas>
</div>

<div class="price-box" id="usdt-box">
    <h2>USDT Price</h2>
    <p id="usdt-price">Loading...</p>
    <canvas id="usdt-chart"></canvas>
</div>

<script>
    // Simulated data (replace with API calls when available)
    const simulatedData = {
        btc: { price: 30000, history: [29000, 29500, 30000, 30500, 31000] },
        usdt: { price: 1.05, history: [1.00, 1.02, 1.05, 1.03, 1.04] }
    };

    function updateUI() {
        Object.entries(simulatedData).forEach(([coin, data]) => {
            const priceEl = document.getElementById(`${coin}-price`);
            const chartEl = document.getElementById(`${coin}-chart`);

            priceEl.textContent = `${data.price} USD`;

            new Chart(chartEl, {
                type: 'line',
                data: {
                    labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri'],
                    datasets: [{
                        label: `${coin.toUpperCase()} Price`,
                        data: data.history,
                        borderColor: coin === 'btc' ? 'orange' : 'blue',
                        fill: false
                    }]
                },
                options: { responsive: true }
            });
        });
    }

    updateUI();
</script>
</body>
</html>
