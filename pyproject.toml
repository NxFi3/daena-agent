[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "daena-agent"
dynamic = ["version"]
description = "Local-first, model-agnostic agent runtime with skills and bounded delegation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "PyYAML>=6,<7",
  "rich>=13.7,<15",
  "prompt_toolkit>=3.0,<4",
  "httpx>=0.28,<1",
  "Pillow>=10,<13",
  "jsonschema>=4.21,<5",
]

[project.optional-dependencies]
ollama = ["ollama>=0.6.3,<1"]
openrouter = ["httpx>=0.28,<1"]
gemini = ["google-genai>=2,<3"]
web = ["ddgs>=9,<10", "pypdf>=5,<7"]
retrieval = ["sentence-transformers>=3,<6"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2"]
desktop = ["PySide6>=6.8,<7"]
computer-x11 = ["python-xlib>=0.33,<1"]
browser = ["playwright>=1.56,<2"]
voice = ["faster-whisper>=1.2,<2", "piper-tts>=1.3,<2", "webrtcvad-wheels>=2.0.14,<3", "soxr>=0.5,<2"]

[project.scripts]
daena = "cli.app:main"

[project.gui-scripts]
daena-studio = "src.studio.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "cli*", "harness*", "AgentInstruction*"]
exclude = ["tests*"]
namespaces = true

[tool.setuptools.package-data]
src = ["default_config.json"]
"src.skills" = ["builtin/*/SKILL.md"]
AgentInstruction = ["*.md"]

[tool.ruff]
target-version = "py311"
exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.setuptools.dynamic]
version = {attr = "src.__version__"}
