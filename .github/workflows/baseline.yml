name: Daena baseline

on:
  push:
    branches:
      - "baseline/**"
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q src harness tests cli
      - name: CLI smoke import
        run: python -c "from cli.app import STYLE; print('CLI_SMOKE_OK')"
      - name: Tests
        run: python -m pytest -q tests
