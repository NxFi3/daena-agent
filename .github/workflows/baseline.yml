name: Daena checks

on:
  push:
    branches:
      - "baseline/**"
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q src harness tests cli
      - name: Static checks
        run: python -m ruff check src cli harness tests
      - name: CLI smoke import
        run: python -c "from cli.app import STYLE; print('CLI_SMOKE_OK')"
      - name: Tests
        run: python -m pytest -q tests
      - name: Build distributions
        run: python -m build
      - name: CLI entry point
        run: daena --help
