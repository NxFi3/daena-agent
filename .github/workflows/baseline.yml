name: Daena checks

on:
  push:
    branches:
      - "baseline/**"
      - main
      - "release-*"
      - "feat/studio-conversation-redesign"
  pull_request:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -r requirements-dev.txt -e '.[browser]'
      - run: python -m playwright install --with-deps chromium
      - name: Real browser and conversation integration
        run: DAENA_TEST_BROWSER=1 python -m pytest -q tests/browser_use
      - name: Installed browser wheel
        run: |
          python -m build
          python -m venv --system-site-packages "$RUNNER_TEMP/browser-wheel"
          "$RUNNER_TEMP/browser-wheel/bin/python" -m pip install --ignore-installed --no-deps dist/daena_agent-0.6.0-py3-none-any.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/browser-wheel/bin/python" "$GITHUB_WORKSPACE/tests/smoke_browser_wheel.py" "$GITHUB_WORKSPACE"
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q src harness tests cli
      - name: Static checks
        run: python -m ruff check src cli harness tests
      - name: CLI smoke import
        run: python -c "from cli.app import STYLE; print('CLI_SMOKE_OK')"
      - name: Tests
        run: python -m pytest -q tests
      - name: Build distributions
        run: python -m build
      - name: CLI entry point
        run: daena --help
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-shape0 xvfb xdotool xauth
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -r requirements-dev.txt -e '.[desktop,computer-x11]'
      - name: Verify native Qt plugin dependencies
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          from PySide6.QtCore import QLibraryInfo
          plugin = Path(QLibraryInfo.path(QLibraryInfo.PluginsPath)) / "platforms/libqxcb.so"
          output = subprocess.check_output(["ldd", str(plugin)], text=True)
          print(output)
          assert "not found" not in output, "Missing native Qt/X11 libraries"
          PY
      - run: python -m pytest -q tests
      - name: Native desktop input
        run: DAENA_TEST_DESKTOP=1 xvfb-run -a python -m pytest -q tests/computer_use/test_desktop.py
      - run: daena-studio --help

      - name: Build and smoke-test installed desktop wheel
        run: |
          python -m build
          python -m venv --system-site-packages "$RUNNER_TEMP/studio-wheel"
          "$RUNNER_TEMP/studio-wheel/bin/python" -m pip install --ignore-installed --no-deps dist/daena_agent-0.6.0-py3-none-any.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/studio-wheel/bin/python" "$GITHUB_WORKSPACE/tests/smoke_studio_wheel.py" "$GITHUB_WORKSPACE"
      - name: Desktop formatting
        run: python -m ruff format --check src/studio tests/test_studio.py tests/test_studio_interactions.py tests/render_studio_preview.py tests/smoke_studio_wheel.py tests/test_reasoning_controls.py src/engine/providers/builtin/gemini/geminiprovider.py
      - name: Render desktop previews
        timeout-minutes: 1
        if: always()
        run: python tests/render_studio_preview.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-previews
          path: .studio-previews/*.png
          include-hidden-files: true

  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Qt system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libopengl0 libxcb-cursor0 libpulse0 pulseaudio pulseaudio-utils libspeexdsp1
      - name: Install optional local speech engines
        run: python -m pip install -e '.[dev,desktop,voice,voice-kokoro,voice-perception]'
      - name: Verify local speech packages without downloading weights
        run: |
          python -c "from faster_whisper import WhisperModel; from piper import PiperVoice; from kokoro_onnx import Kokoro; import soxr, webrtcvad, sherpa_onnx; print('LOCAL_SPEECH_IMPORTS_OK')"
          python -m src.voice doctor
      - name: Voice lifecycle, audio conversion and UI regressions
        run: python -m pytest -q tests/test_voice*.py
      - name: Native Speex echo cancellation and interruption
        run: |
          python -c "from src.voice.duplex import backend_status; assert backend_status()['backend'] == 'speexdsp'"
          DAENA_TEST_VOICE_DUPLEX=1 python -m pytest -q tests/test_voice_duplex.py
      - name: Real Qt playback through an isolated PulseAudio monitor
        run: DAENA_TEST_AUDIO_LOOPBACK=1 python -m pytest -q tests/test_voice_output_native.py tests/test_voice_duplex_native.py
      - name: Build and exercise installed voice integration
        run: |
          python -m build
          python -m venv --system-site-packages "$RUNNER_TEMP/voice-wheel"
          "$RUNNER_TEMP/voice-wheel/bin/python" -m pip install --ignore-installed --no-deps dist/daena_agent-0.6.0-py3-none-any.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/voice-wheel/bin/python" "$GITHUB_WORKSPACE/tests/smoke_voice_wheel.py" "$GITHUB_WORKSPACE"

  windows-runtime:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: Windows runtime and process contracts
        run: python -m pytest -q tests/test_process_input_stability.py tests/test_process_runtime.py tests/test_runtime_lifecycle_regressions.py tests/test_tool_registry.py tests/test_dispatcher.py
